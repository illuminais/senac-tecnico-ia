name: Deploy Worker (API)

on:
  push:
    branches: [master]
    paths:
      - 'platform/worker/**'
      - 'platform/shared/**'      # pure.ts é consumido pelo worker E pelo portal
      - 'platform/wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  # Diferente do Pages: um wrangler deploy cortado no meio é pior que fila, e
  # deploy de worker leva segundos. Enfileira em vez de cancelar.
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:worker

      - name: Typecheck
        run: npm run typecheck:worker

      # Pré-requisitos conferidos em 2026-08-08, antes de ligar este step:
      #
      #  [ok] Schema D1: as 19 tabelas do schema.sql existem em produção, e os
      #       dois ALTER TABLE manuais documentados já estão aplicados
      #       (users.turma_id e notas.comentario). Continua valendo a regra:
      #       schema.sql é aplicado À MÃO antes de mergear. NÃO adicionar
      #       `wrangler d1 execute` aqui — não existe diretório de migrations.
      #  [ok] Paridade master vs produção: produção estava 3 commits atrás
      #       (último deploy 2026-07-29T15:45Z, sem o refactor de routes/+lib/).
      #       Resolvido com deploy manual a partir de master + smoke test das
      #       rotas, então o primeiro deploy automático daqui é um no-op.
      #  [ok] Secrets (JWT_SECRET, RESEND_API_KEY, GOOGLE_CLIENT_SECRET) já
      #       estão no script e NÃO são tocados por `wrangler deploy`. Não
      #       adicionar `wrangler secret put` aqui.
      #  [!!] CLOUDFLARE_API_TOKEN: o token do repositório precisa de
      #       "Workers Scripts: Edit" + "D1: Edit" além do "Pages: Edit" que já
      #       tinha. Se este step falhar com 403 / código 10000, é isso —
      #       atualizar em dash.cloudflare.com > My Profile > API Tokens.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform
          command: deploy
